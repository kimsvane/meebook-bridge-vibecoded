name: "Meebook Bridge"
version: "1.0.18"
slug: meebook_bridge
description: >-
  Læser data fra Meebook (elevplan, lektier, fravær) ind i Home Assistant.
  Kører en browser (Playwright) i containeren, fanger Meebooks REST-API-svar
  og eksponerer dem som JSON på port 8600 til REST-sensorer.
  Unilogin/MitID-login sker indlejret i add-on'ets web-UI (ingen VNC).
  Sensorer oprettes automatisk via MQTT-discovery.
url: "https://github.com/kimsvane/meebook-bridge-vibecoded"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: homeassistant_config
    read_only: false
mqtt: true
hassio_api: true
ports:
  8600/tcp: 8600
ports_description:
  8600/tcp: "API til Home Assistant REST-sensorer"
ingress: true
ingress_port: 8600
ingress_entry: /
panel_icon: mdi:book-open-page-variant
panel_title: "Meebook"
options:
  refresh_interval_minutes: 15
  navigate_urls:
    - "https://app.meebook.com/foraeldre/dashboard/"
    - "https://app.meebook.com/foraeldre/arsplaner/"
    - "https://app.meebook.com/foraeldre/ugeplaner/"
    - "https://app.meebook.com/foraeldre/meddelelsesbog/"
  page_settle_ms: 4000
  headless_refresh: true
schema:
  refresh_interval_minutes: int
  navigate_urls:
    - str
  page_settle_ms: "int(0,60000)"
  headless_refresh: bool
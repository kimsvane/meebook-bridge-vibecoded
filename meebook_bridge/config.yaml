name: "Meebook Bridge"
version: "1.0.0"
slug: meebook_bridge
description: >-
  Læser data fra Meebook (elevplan, lektier, fravær) ind i Home Assistant.
  Kører en browser (Playwright) i containeren, fanger Meebooks REST-API-svar
  og eksponerer dem som JSON på port 8600 til REST-sensorer.
  Manuel Unilogin/MitID-login sker via VNC på port 5900.
url: "https://github.com/kimsvane/meebook-bridge-vibecoded"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ports:
  8600/tcp: 8600
  5900/tcp: 5900
ports_description:
  8600/tcp: "API til Home Assistant REST-sensorer"
  5900/tcp: "VNC til manuel login (Unilogin/MitID)"
ingress: true
ingress_port: 8600
ingress_entry: /
panel_icon: mdi:book-open-page-variant
panel_title: "Meebook"
options:
  refresh_interval_minutes: 15
  navigate_urls:
    - "https://app.meebook.com/foraeldre/dashboard/"
    - "https://app.meebook.com/foraeldre/arsplaner/"
  page_settle_ms: 4000
  headless_refresh: true
  vnc_password: ""
schema:
  refresh_interval_minutes: int
  navigate_urls:
    - str
  page_settle_ms: "int(0,60000)"
  headless_refresh: bool
  vnc_password: str